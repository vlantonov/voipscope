name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 12 Release
            os: ubuntu-22.04
            cc: gcc-12
            cxx: g++-12
            build_type: Release
            extra_cmake: ""
            extra_pkgs: ""

          - name: GCC 12 ASan+UBSan
            os: ubuntu-22.04
            cc: gcc-12
            cxx: g++-12
            build_type: Debug
            extra_cmake: >-
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
            extra_pkgs: ""

          - name: Clang 18 Release
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            build_type: Release
            extra_cmake: ""
            extra_pkgs: "clang-18"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev \
            cmake \
            ninja-build \
            python3-pip

      - name: Install extra packages
        if: matrix.extra_pkgs != ''
        run: sudo apt-get install -y --no-install-recommends ${{ matrix.extra_pkgs }}

      - name: Install Conan
        run: pip3 install --break-system-packages "conan>=2.0"

      - name: Detect Conan profile
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}-${{ matrix.cc }}-${{ matrix.build_type }}-${{ hashFiles("conanfile.txt") }}
          restore-keys: conan-${{ matrix.os }}-${{ matrix.cc }}-${{ matrix.build_type }}-

      - name: Install Conan dependencies
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=${{ matrix.build_type }} \
            -s compiler.cppstd=20

      - name: Configure
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ matrix.extra_cmake }}

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        working-directory: build
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --output-on-failure --parallel $(nproc)
