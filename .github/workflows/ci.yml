name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 12 Release
            cc: gcc-12
            cxx: g++-12
            build_type: Release
            extra_flags: ""

          - name: GCC 12 ASan+UBSan
            cc: gcc-12
            cxx: g++-12
            build_type: Debug
            extra_flags: >-
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

          - name: Clang 16 Release
            cc: clang-16
            cxx: clang++-16
            build_type: Release
            extra_flags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev \
            cmake \
            ninja-build \
            clang-16

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ hashFiles('cmake/FetchDependencies.cmake') }}
          restore-keys: deps-

      - name: Configure
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ matrix.extra_flags }}

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        working-directory: build
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --output-on-failure --parallel $(nproc)
